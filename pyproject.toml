[build-system]
requires = [
    "setuptools>=69",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "bb-s3-copy"
version = "1.0.0"
description = "Reusable S3 Copy Data Building Block"
requires-python = ">=3.11"

dependencies = [
    "boto3>=1.34"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]